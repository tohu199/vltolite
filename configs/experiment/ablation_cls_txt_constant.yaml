# @package _global_
# L_cls + L_txt, loss schedule: constant (w_cls=1, w_kd=1)
defaults:
  - override /trainer: gpu
  - override /model/loss_schedule: constant

tags: ["ablation", "cls_txt", "constant"]

model:
  use_teacher: true
  use_img_kd: false
  use_txt_kd: true

logger:
  wandb:
    tags: ${tags}
    name: "${data.data_name}_ablation_cls_txt_constant"
