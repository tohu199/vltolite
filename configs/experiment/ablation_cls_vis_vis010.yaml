# @package _global_
# L_cls + L_vis at 1/10 scale (img_kd_scale=0.1), default linear_slow schedule
defaults:
  - override /trainer: gpu

tags: ["ablation", "cls_vis", "vis010"]

model:
  use_teacher: true
  use_img_kd: true
  use_txt_kd: false
  img_kd_scale: 0.1

logger:
  wandb:
    tags: ${tags}
    name: "${data.data_name}_ablation_cls_vis_vis010"
