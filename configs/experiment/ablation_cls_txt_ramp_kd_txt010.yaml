# @package _global_
# L_cls + L_txt at 1/10, loss schedule: linear_ramp_kd
defaults:
  - override /trainer: gpu
  - override /model/loss_schedule: linear_ramp_kd

tags: ["ablation", "cls_txt", "ramp_kd", "txt010"]

model:
  use_teacher: true
  use_img_kd: false
  use_txt_kd: true
  txt_kd_scale: 0.1

logger:
  wandb:
    tags: ${tags}
    name: "${data.data_name}_ablation_cls_txt_ramp_kd_txt010"
